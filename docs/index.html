<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alert triage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Alert queue">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
        </div>
        <div>
          <h1>Alert triage</h1>
          <p>UK transaction monitoring</p>
        </div>
      </div>
      <input id="search" class="search" type="search" placeholder="Search name or case" aria-label="Search the queue">
      <div class="segmented" role="group" aria-label="Institution">
        <button type="button" data-inst="all" aria-pressed="true">All</button>
        <button type="button" data-inst="bank">Bank</button>
        <button type="button" data-inst="payments_fx">FX</button>
        <button type="button" data-inst="emoney">E-money</button>
        <button type="button" data-inst="investment">Invest</button>
      </div>
      <div class="chips" role="group" aria-label="Verdict">
        <button type="button" data-verdict="all" aria-pressed="true">All</button>
        <button type="button" data-verdict="CLOSE">Close</button>
        <button type="button" data-verdict="RFI">RFI</button>
        <button type="button" data-verdict="ESCALATE">Escalate</button>
      </div>
      <div id="queue" class="queue" role="listbox" aria-label="Cases" tabindex="0"></div>
    </aside>
    <div class="workspace">
      <header class="toolbar">
        <div class="segmented" role="group" aria-label="View">
          <button type="button" id="tab-case" aria-pressed="true">Case</button>
          <button type="button" id="tab-board">Summary</button>
        </div>
        <a class="tool" href="dashboard.html">Model cost</a>
        <span class="spacer"></span>
        <div class="segmented" role="group" aria-label="Appearance">
          <button type="button" data-theme="system" aria-pressed="true">Auto</button>
          <button type="button" data-theme="light">Light</button>
          <button type="button" data-theme="dark">Dark</button>
        </div>
        <button class="tool" id="load-sample" type="button">Sample queue</button>
        <label class="tool">Open folder<input id="folder" type="file" webkitdirectory multiple hidden></label>
        <button class="tool" id="export-jsonl" type="button">Export JSONL</button>
        <button class="tool ghost" id="export-csv" type="button">CSV</button>
      </header>
      <main id="main" class="content">
        <section id="case-view" aria-live="polite"></section>
        <section id="board-view" hidden></section>
      </main>
    </div>
  </div>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
